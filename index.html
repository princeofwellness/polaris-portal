<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLARIS — Know Your Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080f;
  --surface: #0f0f1a;
  --border: rgba(255,255,255,0.07);
  --text: #d4d4e0;
  --text-dim: rgba(255,255,255,0.35);
  --text-subtle: rgba(255,255,255,0.15);
  --accent: #d4a058;
  --accent-light: rgba(212,160,88,0.08);
  --grad1: rgba(212,160,88,0.03);
  --grad2: rgba(100,140,200,0.02);
}

[data-theme="light"] {
  --bg: #faf8f5;
  --surface: #fff;
  --border: rgba(0,0,0,0.07);
  --text: #1a1a24;
  --text-dim: rgba(0,0,0,0.40);
  --text-subtle: rgba(0,0,0,0.15);
  --accent: #b8860b;
  --accent-light: rgba(184,134,11,0.06);
  --grad1: rgba(184,134,11,0.03);
  --grad2: rgba(0,0,0,0.01);
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  background-image:
    radial-gradient(ellipse at 50% 0%, var(--grad1) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 100%, var(--grad2) 0%, transparent 40%);
  transition: background 0.4s, color 0.4s;
}

/* Theme toggle */
.theme-toggle {
  position: fixed; top: 24px; right: 24px; z-index: 10;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-dim); transition: all 0.3s;
}
.theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

.container {
  width: 100%; max-width: 440px; padding: 48px 24px;
}

header {
  text-align: center; margin-bottom: 44px;
}
.sigil {
  font-family: 'Cormorant Garamond', serif;
  font-size: 48px; font-weight: 300; line-height: 1;
  color: var(--accent); margin-bottom: 20px;
  transition: color 0.4s;
}
h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px; font-weight: 300; letter-spacing: 4px;
  text-transform: uppercase; margin-bottom: 14px;
  transition: color 0.4s;
}
.tagline {
  font-size: 13px; color: var(--text-dim);
  line-height: 1.7; max-width: 340px; margin: 0 auto;
}
.systems-row {
  margin-top: 24px; display: flex; justify-content: center; gap: 24px;
  font-size: 10px; color: var(--text-subtle); letter-spacing: 1.5px;
  text-transform: uppercase;
}

form { display: flex; flex-direction: column; gap: 16px; }

.field { position: relative; }
.field label {
  display: block; font-size: 10px; text-transform: uppercase;
  letter-spacing: 2px; color: var(--text-dim); margin-bottom: 6px;
  font-weight: 500; transition: color 0.2s;
}
.field:focus-within label { color: var(--accent); }

.field input {
  width: 100%; padding: 13px 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-size: 14px; font-family: 'Inter', sans-serif;
  outline: none; transition: all 0.2s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.field input::placeholder { color: var(--text-subtle); }

.row { display: flex; gap: 12px; }
.row .field { flex: 1; }

.city-hint {
  font-size: 10px; color: var(--text-dim); margin-top: -8px;
  margin-bottom: 4px; letter-spacing: 0.3px;
  display: none;
}
.city-hint.show { display: block; }

button {
  width: 100%; padding: 15px; margin-top: 12px;
  background: var(--accent); border: none; border-radius: 6px;
  color: #fff; font-size: 13px; font-weight: 500;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; font-family: 'Inter', sans-serif;
  transition: all 0.25s;
}
button:hover { opacity: 0.9; }
button:active { transform: scale(0.98); }

.status {
  text-align: center; font-size: 11px; color: var(--accent);
  margin-top: 8px; min-height: 16px;
}

.footer-note {
  text-align: center; margin-top: 36px;
  font-size: 10px; color: var(--text-subtle); letter-spacing: 0.5px;
}

@media (max-width: 480px) {
  .container { padding: 36px 18px; }
  h1 { font-size: 22px; letter-spacing: 3px; }
  .systems-row { gap: 16px; }
  .theme-toggle { top: 16px; right: 16px; }
  button { padding: 14px; font-size: 12px; }
}
</style>
</head>
<body>

<button class="theme-toggle" id="theme-btn" title="Toggle theme" aria-label="Toggle light/dark mode">☀</button>

<div class="container">

<header>
  <div class="sigil">◈</div>
  <h1>POLARIS</h1>
  <p class="tagline">
    Your birth data, read through four ancient systems. Not a horoscope — a map of the architecture you arrived with.
  </p>
  <div class="systems-row">
    <span>Astrology</span>
    <span>Human Design</span>
    <span>Numerology</span>
    <span>Chinese Zodiac</span>
  </div>
</header>

<form id="portal-form" method="GET" action="/generate">
  <input type="hidden" name="lat" id="lat-field" value="48.1486">
  <input type="hidden" name="lon" id="lon-field" value="17.1077">
  <input type="hidden" name="tz" id="tz-field" value="+01:00">

  <div class="field">
    <label>Full Birth Name</label>
    <input name="name" placeholder="Your name as given at birth" required autofocus>
  </div>

  <div class="row">
    <div class="field">
      <label>Birth Date</label>
      <input name="date" type="date" required>
    </div>
    <div class="field">
      <label>Birth Time</label>
      <input name="time" type="time" required>
    </div>
  </div>

  <div class="field">
    <label>Place of Birth</label>
    <input name="city" id="city-input" placeholder="City name — e.g. Bratislava, London, Tokyo" required>
    <div class="city-hint" id="city-hint"></div>
  </div>

  <div id="status" class="status"></div>

  <button type="submit">Generate Portal</button>
</form>

<p class="footer-note">
  NASA JPL Ephemeris · Cosmos Engine (MIT) · Swiss Ephemeris-verified
</p>

</div>

<script>
// Theme toggle
const html = document.documentElement;
const btn = document.getElementById('theme-btn');
const saved = localStorage.getItem('polaris-theme') || 'dark';
html.setAttribute('data-theme', saved);
btn.textContent = saved === 'dark' ? '☀' : '☾';

btn.addEventListener('click', () => {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  btn.textContent = next === 'dark' ? '☀' : '☾';
  localStorage.setItem('polaris-theme', next);
});

// Timezone offset
const offset = -new Date().getTimezoneOffset();
const h = Math.floor(Math.abs(offset)/60), m = Math.abs(offset)%60;
const sign = offset >= 0 ? '+' : '-';
document.getElementById('tz-field').value = `${sign}${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;

// Browser geolocation
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('lat-field').value = pos.coords.latitude.toFixed(4);
    document.getElementById('lon-field').value = pos.coords.longitude.toFixed(4);
  }, () => {});
}

// City geocoding
let timer;
document.getElementById('city-input').addEventListener('input', function() {
  clearTimeout(timer);
  const q = this.value.trim();
  if (q.length < 3) return;
  timer = setTimeout(async () => {
    const hint = document.getElementById('city-hint');
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=3`);
      const d = await r.json();
      if (d.length > 0) {
        document.getElementById('lat-field').value = parseFloat(d[0].lat).toFixed(4);
        document.getElementById('lon-field').value = parseFloat(d[0].lon).toFixed(4);
        hint.textContent = 'Found: ' + d[0].display_name.split(',')[0].trim();
        hint.classList.add('show');
      } else {
        hint.textContent = 'Not found — try a more specific name';
        hint.classList.add('show');
      }
    } catch(e) {}
  }, 600);
});

// Prevent empty submits
document.getElementById('portal-form').addEventListener('submit', function(e) {
  const city = document.getElementById('city-input').value.trim();
  if (city.length < 1) {
    e.preventDefault();
    document.getElementById('status').textContent = 'Please enter a city name';
  }
});
</script>

</body>
</html>
