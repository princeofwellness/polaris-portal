<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POLARIS Portal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap');

:root {
  --void: #05050a;
  --abyss: #080812;
  --surface: rgba(255,255,255,0.02);
  --border: rgba(255,255,255,0.06);
  --text: #e0e0ec;
  --text-dim: #6a6a80;
  --cyan: #00e5ff;
  --magenta: #ff2d95;
  --lime: #76ff03;
  --amber: #ff9100;
  --violet: #b388ff;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--void);
  color: var(--text);
  font-family: 'Space Grotesk', -apple-system, sans-serif;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow-x: hidden;
}
body::before {
  content: ''; position: fixed; top: -50%; left: -50%;
  width: 200%; height: 200%;
  background:
    radial-gradient(circle at 20% 80%, rgba(0,229,255,0.03) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255,45,149,0.03) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(118,255,3,0.02) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
}

.container {
  max-width: 520px; width: 100%; padding: 50px 24px;
  position: relative; z-index: 1;
}

.header { text-align:center; margin-bottom: 44px; }
.glyph {
  font-size: 56px; letter-spacing: 12px; margin-bottom: 16px;
  background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--lime), var(--amber));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  animation: hueSpin 8s ease infinite;
}
@keyframes hueSpin {
  0%,100% { filter: hue-rotate(0deg); }
  50% { filter: hue-rotate(45deg); }
}
.header h1 {
  font-size: 24px; font-weight: 300; letter-spacing: 8px;
  text-transform: uppercase; margin-bottom: 8px;
}
.header .tagline {
  font-size: 11px; color: var(--text-dim); letter-spacing: 3px;
}

.system-strip {
  display: flex; justify-content: center; gap: 8px; margin: 24px 0 36px; flex-wrap: wrap;
}
.strip-dot {
  width: 6px; height: 6px; border-radius: 50%;
}
.strip-dot:nth-child(1) { background: var(--cyan); }
.strip-dot:nth-child(2) { background: var(--violet); }
.strip-dot:nth-child(3) { background: var(--lime); }
.strip-dot:nth-child(4) { background: var(--amber); }

form { display:flex; flex-direction:column; gap:13px; }
label {
  font-size: 9px; text-transform: uppercase; letter-spacing: 3px;
  color: var(--text-dim); font-weight: 500;
}
input {
  padding: 14px 16px; background: var(--abyss);
  border: 1px solid var(--border); color: var(--text);
  font-size: 14px; font-family: 'Space Grotesk', sans-serif;
  outline: none; transition: all 0.25s;
}
input:focus { border-color: var(--cyan); box-shadow: 0 0 0 1px rgba(0,229,255,0.15); }
.row { display:flex; gap:10px; }
.row input { flex:1; }

button {
  padding: 16px; margin-top: 12px;
  background: transparent; border: 2px solid var(--cyan);
  color: var(--cyan); font-size: 13px; font-weight: 500;
  letter-spacing: 4px; text-transform: uppercase;
  cursor: pointer; font-family: 'Space Grotesk', sans-serif;
  transition: all 0.3s; position: relative; overflow: hidden;
}
button:hover {
  background: var(--cyan); color: var(--void);
  box-shadow: 0 0 30px rgba(0,229,255,0.25);
}
button::after {
  content: ''; position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
  transition: left 0.5s;
}
button:hover::after { left: 100%; }

.footer {
  text-align: center; margin-top: 40px;
  font-size: 9px; color: rgba(255,255,255,0.12); letter-spacing: 2px;
  line-height: 2;
}

/* Pulse ring */
.pulse-ring {
  position: fixed; bottom: 30px; right: 30px;
  width: 40px; height: 40px; border: 2px solid var(--cyan);
  border-radius: 50%; animation: pulse 2s ease-out infinite; z-index: 0;
  opacity: 0.3;
}
@keyframes pulse {
  0% { transform: scale(1); opacity: 0.3; }
  100% { transform: scale(3); opacity: 0; }
}
</style>
</head>
<body>
<div class="container">
<header class="header">
  <div class="glyph">◈</div>
  <h1>POLARIS</h1>
  <div class="tagline">FOUR ANCIENT SYSTEMS · ONE LIVING MIRROR</div>
  <div class="system-strip">
    <div class="strip-dot"></div><div class="strip-dot"></div>
    <div class="strip-dot"></div><div class="strip-dot"></div>
  </div>
</header>

<form method="POST" action="/generate">
  <label>Full Birth Name</label>
  <input name="name" placeholder="Your full birth name" required autofocus>

  <label>Birth Date</label>
  <input name="date" type="date" required>

  <label>Birth Time</label>
  <input name="time" type="time" required>

  <div class="row">
    <div style="flex:1">
      <label>Latitude</label>
      <input name="lat" placeholder="48.1486" value="48.1486">
    </div>
    <div style="flex:1">
      <label>Longitude</label>
      <input name="lon" placeholder="17.1077" value="17.1077">
    </div>
  </div>

  <label>Timezone (UTC offset, e.g. +01:00)</label>
  <input name="tz" placeholder="+01:00" value="+01:00">

  <button type="submit">GENERATE PORTAL</button>
</form>

<div class="footer">
  Astrology · Human Design · Numerology · Chinese Zodiac<br>
  Cosmos Engine · MIT · NASA JPL Ephemeris
</div>
</div>
<div class="pulse-ring"></div>
</body>
</html>
